[project]
name = "rag-lab"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "hamzacodev", email = "hamzacodev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "matplotlib>=3.11.1",
    "ollama>=0.6.2",
    "onnxruntime==1.18.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "sentence-transformers==2.7.0",
    "torch==2.2.2",
    "transformers==4.41.2",
    "uvicorn>=0.52.4",
]

[project.scripts]
rag-lab = "rag_lab:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
